name: Build and test WeaponLab

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure MSVC x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DWEAPONLAB_BUILD_TESTS=ON
      - name: Compile application and tests
        run: cmake --build build --config Release --parallel
      - name: Test core, UI and native D3D11 WARP / PNG
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WeaponLab-Windows-x64
          path: |
            build/Release/WeaponLab.exe
            build/Release/assets/Preview.hlsl
          if-no-files-found: error
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-test-diagnostics
          path: |
            build/Testing/Temporary/
            build/Release/weaponlab-smoke.txt
          if-no-files-found: ignore
  portable-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure ASan and UBSan
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWEAPONLAB_SANITIZERS=ON
      - name: Compile checks
        run: cmake --build build --parallel 2
      - name: Run checks
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build --output-on-failure
